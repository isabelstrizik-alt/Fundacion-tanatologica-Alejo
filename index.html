<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fundación Tanatológica Alejo" />
    <title>Fundación Tanatológica Alejo</title>
  </head>
  <body>
    <p id="status">Cargando Fundación Tanatológica Alejo…</p>
    <script>
      fetch("img/Fundacion%20alejo%20(3).txt")
        .then((response) => {
          if (!response.ok) throw new Error("No se pudo cargar el archivo de la página.");
          return response.text();
        })
        .then((html) => {
          const imageLinks = [
            ["data:image/jpeg;base64,(logo fundacion)", "img/Logo%20Fundacion.png"],
            ["data:image/png;base64,(Foto Isabel Elisa Strik)", "img/Isabel%20Elisa%20Strizik.png"],
            ["data:image/png;base64,(foto Agustin Kpsspy Strizik)", "img/Agustin%20Kossoy%20Strizik.png"],
            ["data:image/png;base64,(foto Denis Bulan)", "img/Denis%20Bulan.png"],
            ["data:image/png;base64,)foto Alejo)", "img/Alejo.png"]
          ];

          for (const [placeholder, path] of imageLinks) {
            html = html.split(placeholder).join(path);
          }

          // Usa el logo circular en la marca del encabezado y dentro de la tarjeta principal.
          html = html.replace(
            '<div class="brand-mark">A</div>',
            '<div class="brand-mark"><img src="img/Logo%20circular.png" alt="" aria-hidden="true" /></div>'
          );
          html = html.replace(
            '<svg class="identity-logo" viewBox="61 752 248 248" xmlns="http://www.w3.org/2000/svg" focusable="false">\n              <image href="img/Logo%20Fundacion.png" width="691" height="1536" />\n            </svg>',
            '<img class="identity-logo" src="img/Logo%20circular.png" alt="Logo de Fundación Tanatológica Alejo" />'
          );

          html = html.replace(
            "</head>",
            `<style>
              .brand-mark{padding:3px;overflow:hidden}
              .brand-mark img{display:block;width:100%;height:100%;object-fit:contain;border-radius:50%}
              .identity-logo{object-fit:contain}
            </style></head>`
          );

          document.open();
          document.write(html);
          document.close();
        })
        .catch((error) => {
          document.getElementById("status").textContent = error.message;
        });
    </script>
  </body>
</html>
