<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fundación Tanatológica Alejo" />
    <title>Fundación Tanatológica Alejo</title>
  </head>
  <body>
    <p id="status">Cargando Fundación Tanatológica Alejo…</p>
    <script>
      fetch("img/Fundacion%20alejo%20(3).txt")
        .then((response) => {
          if (!response.ok) throw new Error("No se pudo cargar el archivo de la página.");
          return response.text();
        })
        .then((html) => {
          const imageLinks = [
            ["data:image/jpeg;base64,(logo circular)", "img/Logo%20circular.png"],
            ["data:image/png;base64,(Foto Isabel Elisa Strik)", "img/Isabel%20Elisa%20Strizik.png"],
            ["data:image/png;base64,(foto Agustin Kpsspy Strizik)", "img/Agustin%20Kossoy%20Strizik.png"],
            ["data:image/png;base64,(foto Denis Bulan)", "img/Denis%20Bulan.png"],
            ["data:image/png;base64,)foto Alejo)", "img/Alejo.png"]
          ];

          for (const [placeholder, path] of imageLinks) {
            html = html.split(placeholder).join(path);
          }

          const testimonios = `
            <section class="testimonios" aria-labelledby="testimonios-titulo">
              <div class="testimonios-encabezado">
                <div class="section-kicker">Testimonios</div>
                <h2 class="testimonios-titulo" id="testimonios-titulo">Así seguimos viviendo</h2>
                <p>Historias de familias que encuentran maneras de seguir viviendo y llevando consigo el amor.</p>
              </div>
              <div class="testimonios-grid">
                <article class="testimonio-card">
                  <div class="testimonio-portada">
                    <img src="(PEGAR LINK)" alt="Imagen de portada del testimonio 1" loading="lazy" decoding="async" />
                    <span class="testimonio-portada-placeholder">(PEGAR LINK de imagen de portada)</span>
                    <button class="testimonio-play" type="button" data-video="(PEGAR LINK)" aria-label="Reproducir testimonio 1">▶</button>
                  </div>
                  <div class="testimonio-copy"><h3>Testimonio 1</h3><a class="testimonio-salida" href="(PEGAR LINK)" target="_blank" rel="noopener noreferrer">Abrir en YouTube o TikTok ↗</a></div>
                </article>
                <article class="testimonio-card">
                  <div class="testimonio-portada">
                    <img src="(PEGAR LINK)" alt="Imagen de portada del testimonio 2" loading="lazy" decoding="async" />
                    <span class="testimonio-portada-placeholder">(PEGAR LINK de imagen de portada)</span>
                    <button class="testimonio-play" type="button" data-video="(PEGAR LINK)" aria-label="Reproducir testimonio 2">▶</button>
                  </div>
                  <div class="testimonio-copy"><h3>Testimonio 2</h3><a class="testimonio-salida" href="(PEGAR LINK)" target="_blank" rel="noopener noreferrer">Abrir en YouTube o TikTok ↗</a></div>
                </article>
                <article class="testimonio-card">
                  <div class="testimonio-portada">
                    <img src="(PEGAR LINK)" alt="Imagen de portada del testimonio 3" loading="lazy" decoding="async" />
                    <span class="testimonio-portada-placeholder">(PEGAR LINK de imagen de portada)</span>
                    <button class="testimonio-play" type="button" data-video="(PEGAR LINK)" aria-label="Reproducir testimonio 3">▶</button>
                  </div>
                  <div class="testimonio-copy"><h3>Testimonio 3</h3><a class="testimonio-salida" href="(PEGAR LINK)" target="_blank" rel="noopener noreferrer">Abrir en YouTube o TikTok ↗</a></div>
                </article>
              </div>
            </section>`;

          // Agrega la nueva sección debajo de “Nuestra mirada”, sin reemplazar el contenido existente.
          html = html.replace(
            /(<h3>Nuestra mirada<\/h3>[\s\S]*?<\/div>\s*<\/div>)(\s*<\/div>\s*<div class="team-column">)/,
            `$1${testimonios}$2`
          );

          // Inserta el logo circular en la marca del encabezado.
          html = html.replace(
            '<div class="brand-mark">A</div>',
            '<div class="brand-mark"><img src="img/Logo%20circular.png" alt="Logo de Fundación Tanatológica Alejo" /></div>'
          );

          // Sustituye todo el SVG anterior de la tarjeta por el archivo de logo circular.
          html = html.replace(
            /<svg class="identity-logo"[\s\S]*?<\/svg>/,
            '<img class="identity-logo" src="img/Logo%20circular.png" alt="Logo de Fundación Tanatológica Alejo" />'
          );

          html = html.replace(
            "</head>",
            `<style>
              .brand-mark{padding:3px;overflow:hidden}
              .brand-mark img{display:block;width:100%;height:100%;object-fit:contain;border-radius:50%}
              .identity-logo{object-fit:contain}
              .testimonios{margin-top:24px;padding:28px;background:var(--paper);border:1px solid rgba(185,154,94,.42);border-radius:24px;box-shadow:var(--shadow)}
              .testimonios-encabezado{max-width:760px;margin-bottom:22px}
              .testimonios-titulo{font-family:Georgia,serif;color:var(--chocolate);font-size:clamp(30px,4vw,40px);line-height:1.15;font-weight:500;margin:0 0 10px}
              .testimonios-encabezado p{color:var(--muted);margin:0}
              .testimonios-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
              .testimonio-card{min-width:0;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:18px}
              .testimonio-portada{position:relative;display:grid;place-items:center;aspect-ratio:16/9;overflow:hidden;background:linear-gradient(135deg,#6d4739,#2f1e19);color:#fff}
              .testimonio-portada img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
              .testimonio-portada img:not([src="(PEGAR LINK)"]){z-index:1}
              .testimonio-portada-placeholder{padding:18px;text-align:center;font-size:13px;color:#f6f0e6}
              .testimonio-play{position:absolute;z-index:2;display:grid;place-items:center;width:52px;height:52px;padding-left:4px;border:1px solid rgba(255,255,255,.8);border-radius:50%;background:rgba(47,30,25,.78);color:white;font-size:19px;cursor:pointer}
              .testimonio-play:hover{background:#4c2f26;transform:scale(1.05)}
              .testimonio-play:focus-visible,.testimonio-salida:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
              .testimonio-video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#201613}
              .testimonio-copy{padding:16px}
              .testimonio-copy h3{margin:0 0 7px;font:500 21px Georgia,serif;color:var(--chocolate)}
              .testimonio-salida{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
              @media(max-width:900px){.testimonios-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
              @media(max-width:620px){.testimonios{padding:22px}.testimonios-grid{grid-template-columns:1fr}}
            </style></head>`
          );

          document.open();
          document.write(html);
          document.close();

          document.querySelectorAll('.testimonio-portada img').forEach((imagen) => {
            imagen.addEventListener('error', () => { imagen.hidden = true; });
            imagen.addEventListener('load', () => {
              imagen.nextElementSibling.hidden = true;
            });
            if (imagen.getAttribute('src') === '(PEGAR LINK)') imagen.hidden = true;
          });

          function obtenerReproductor(enlace) {
            let url;
            try { url = new URL(enlace); } catch (error) { return null; }
            const host = url.hostname.replace(/^www\./, '');
            let id;
            if (host === 'youtu.be') {
              id = url.pathname.split('/').filter(Boolean)[0];
              return id ? `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&playsinline=1&rel=0` : null;
            }
            if (host.endsWith('youtube.com') || host === 'youtube-nocookie.com') {
              id = url.searchParams.get('v') || url.pathname.match(/\/(?:embed|shorts|live)\/([^/?]+)/)?.[1];
              return id ? `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&playsinline=1&rel=0` : null;
            }
            if (host.endsWith('tiktok.com')) {
              id = url.pathname.match(/\/video\/(\d+)/)?.[1];
              return id ? `https://www.tiktok.com/player/v1/${id}?autoplay=1` : null;
            }
            return null;
          }

          document.querySelectorAll('.testimonio-play').forEach((boton) => {
            boton.addEventListener('click', () => {
              const tarjeta = boton.closest('.testimonio-card');
              const portada = boton.closest('.testimonio-portada');
              const enlace = boton.dataset.video;
              const reproductor = obtenerReproductor(enlace);
              if (!reproductor) {
                alert('Reemplazá (PEGAR LINK) por un enlace de video de YouTube o TikTok.');
                return;
              }
              const iframe = document.createElement('iframe');
              iframe.className = 'testimonio-video';
              iframe.src = reproductor;
              iframe.title = tarjeta.querySelector('h3').textContent;
              iframe.loading = 'lazy';
              iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
              iframe.allowFullscreen = true;
              iframe.referrerPolicy = 'strict-origin-when-cross-origin';
              portada.replaceChildren(iframe);
            });
          });
        })
        .catch((error) => {
          document.getElementById("status").textContent = error.message;
        });
    </script>
  </body>
</html>
