<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fundación Tanatológica Alejo" />
    <title>Fundación Tanatológica Alejo</title>
  </head>
  <body>
    <p id="status">Cargando Fundación Tanatológica Alejo…</p>
    <script>
      fetch("img/Fundacion%20alejo%20(3).txt")
        .then((response) => {
          if (!response.ok) throw new Error("No se pudo cargar el archivo de la página.");
          return response.text();
        })
        .then((html) => {
          const replacements = [
            ["data:image/jpeg;base64,(logo circular)", "img/Logo%20circular.png"],
            ["data:image/jpeg;base64,(logo fundacion)", "img/Logo%20circular.png"],
            ["data:image/png;base64,(Foto Isabel Elisa Strik)", "img/Isabel%20Elisa%20Strizik.png"],
            ["data:image/png;base64,(foto Agustin Kpsspy Strizik)", "img/Agustin%20Kossoy%20Strizik.png"],
            ["data:image/png;base64,(foto Denis Bulan)", "img/Denis%20Bulan.png"],
            ["data:image/png;base64,)foto Alejo)", "img/Alejo.png"]
          ];

          for (const [placeholder, path] of replacements) {
            html = html.split(placeholder).join(path);
          }

          html = html.replace(
            '<div class="brand-mark">A</div>',
            '<div class="brand-mark"><img src="img/Logo%20circular.png" alt="Logo de Fundación Tanatológica Alejo" /></div>'
          );
          html = html.replace(
            /<svg class="identity-logo"[\s\S]*?<\/svg>/,
            '<img class="identity-logo" src="img/Logo%20circular.png" alt="Logo de Fundación Tanatológica Alejo" />'
          );
          html = html.replace(
            '<div class="contact-item"><strong>WhatsApp:</strong> próximamente</div>',
            '<div class="contact-item"><strong>WhatsApp:</strong> <a href="https://wa.me/5493644409611" target="_blank" rel="noopener noreferrer">+54 9 3644 409611</a></div>'
          );
          html = html.replace(
            '<div class="contact-item"><strong>Correo:</strong> próximamente</div>',
            '<div class="contact-item"><strong>Correo:</strong> <a href="mailto:fta@fundaciontanatologicaalejo.org">fta@fundaciontanatologicaalejo.org</a></div>'
          );
          html = html.replace(
            `<div class="actions" style="margin-top:24px">
             <a class="btn btn-primary" href="#contacto">Quiero recibir novedades</a>
           </div>`,
            `<form id="novedadesForm" class="novedades-form">
              <label for="novedadesEmail">Tu correo electrónico</label>
              <input id="novedadesEmail" name="email" type="email" autocomplete="email" placeholder="nombre@ejemplo.com" required />
              <p class="novedades-ayuda">Al continuar, se abrirá tu aplicación de correo para que confirmes el envío.</p>
              <button class="btn btn-primary" type="submit">Quiero recibir novedades</button>
            </form>`
          );
          html = html.replace(
            "</head>",
            `<style>
              .brand-mark{padding:3px;overflow:hidden}
              .brand-mark img{display:block;width:100%;height:100%;object-fit:contain;border-radius:50%}
              .identity-logo{object-fit:contain}
              .novedades-form{display:grid;gap:10px;margin-top:24px}
              .novedades-form label{font-weight:700;color:var(--chocolate)}
              .novedades-form input{width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fffaf4;color:var(--ink);font:inherit}
              .novedades-form input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
              .novedades-ayuda{margin:0 0 6px;color:var(--muted);font-size:13px}
              .novedades-form button{justify-self:start;cursor:pointer}
            </style></head>`
          );

          document.open();
          document.write(html);
          document.close();

          document.getElementById('novedadesForm')?.addEventListener('submit', (event) => {
            event.preventDefault();
            const campoEmail = document.getElementById('novedadesEmail');
            if (!campoEmail.reportValidity()) return;

            const asunto = encodeURIComponent('Solicitud para recibir novedades');
            const mensaje = encodeURIComponent(
              `Por favor, agregar este correo a la lista de novedades de la Fundación:\n${campoEmail.value.trim()}`
            );
            window.location.href = `mailto:fta@fundaciontanatologicaalejo.org?subject=${asunto}&body=${mensaje}`;
          });

          const audio = document.querySelector('#musicaFondo');
          const source = audio?.querySelector('source');
          if (source) source.src = 'img/Disturbed%20%20-%20The%20Sound%20Of%20Silence%20(Official%20Music%20Video)%20%5B4K%20UPGRADE%5D%20-%20Disturbed.mp3';
          if (audio) {
            audio.loop = true;
            audio.preload = 'auto';
            audio.load();
          }
        })
        .catch((error) => {
          document.getElementById("status").textContent = error.message;
        });
    </script>
  </body>
</html>
